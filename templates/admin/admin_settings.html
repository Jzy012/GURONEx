{% extends 'admin/admin_base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-10">

  <!-- Page Title and Back Button -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <h2 class="text-3xl font-bold text-gray-900 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-[#800505]">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
    </svg>
      Admin Settings
    </h2>
    <a href="{% url 'adminhub:home' %}"
       class="flex items-center gap-2 px-3 py-2 bg-[#800505] hover:bg-[#a80707] text-white rounded-lg shadow-md transition duration-200 whitespace-nowrap text-sm font-semibold">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      <span>Back to Home</span>
    </a>
  </div>

  <!-- Settings List -->
  <div class="bg-white rounded-xl shadow">
    <ul class="divide-y divide-gray-200">
      <!-- Security Section -->
      <li>
        <div class="px-6 py-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-1.5 bg-red-100 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-[#800505]">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800">Security</h3>
          </div>
          <ul class="ml-10 space-y-1">
            <li>
              <a href="{% url 'adminhub:admin_change_password' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                Change Password
              </a>
            </li>
            <li>
              <a href="{% url 'adminhub:admin_2fa' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                Two-Factor Authentication (2FA)
              </a>
            </li>
          </ul>
        </div>
      </li>
      <!-- Academic Year Section -->
      <li>
        <div class="px-6 py-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-1.5 bg-red-100 rounded-full">
              <svg class="w-5 h-5 text-[#800505]" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 4v16m8-8H4"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800">Academic Year</h3>
          </div>
          <ul class="ml-10 space-y-1">
            <li>
              <a href="{% url 'adminhub:academic_years' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                Manage Academic Year & Semesters
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</div>
{% endblock %}
