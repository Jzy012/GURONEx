{% extends 'admin/admin_base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-10">

  <!-- Page Title and Back Button -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <h2 class="text-3xl font-bold text-gray-900 flex items-center gap-2">
      <svg class="w-7 h-7 text-[#800505]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/>
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
      Admin Settings
    </h2>
    <a href="{% url 'adminhub:home' %}"
       class="flex items-center gap-2 px-3 py-2 bg-[#800505] hover:bg-[#a80707] text-white rounded-lg shadow-md transition duration-200 whitespace-nowrap text-sm font-semibold">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      <span>Back to Home</span>
    </a>
  </div>

  <!-- Settings List -->
  <div class="bg-white rounded-xl shadow">
    <ul class="divide-y divide-gray-200">
      <!-- Security Section -->
      <li>
        <div class="px-6 py-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-1.5 bg-blue-100 rounded-full">
              <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 17.25v.75m-6-4.5V10.5A6 6 0 0112 4.5a6 6 0 016 6v3a2.25 2.25 0 01.75 1.66v2.09A2.25 2.25 0 0116.5 20.25h-9A2.25 2.25 0 014.5 17.25v-2.09A2.25 2.25 0 015.25 13.5z"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800">Security</h3>
          </div>
          <ul class="ml-10 space-y-1">
            <li>
              <a href="{% url 'adminhub:admin_change_password' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m2-2a2 2 0 11-4 0v-2a2 2 0 014 0zM6 11V7a6 6 0 1112 0v4"/>
                </svg>
                Change Password
              </a>
            </li>
            <li>
              <a href="{% url 'adminhub:admin_2fa' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                </svg>
                Two-Factor Authentication (2FA)
              </a>
            </li>
          </ul>
        </div>
      </li>
      <!-- Academic Year Section -->
      <li>
        <div class="px-6 py-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-1.5 bg-green-100 rounded-full">
              <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 4v16m8-8H4"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800">Academic Year</h3>
          </div>
          <ul class="ml-10 space-y-1">
            <li>
              <a href="{% url 'adminhub:academic_years' %}" 
                 class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <rect x="3" y="6" width="18" height="13" rx="2" stroke-width="2"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 2v4M8 2v4"/>
                </svg>
                Manage Academic Year & Semesters
              </a>
            </li>
          </ul>
        </div>
      </li>

      <!-- Add More Settings Sections As Needed -->
      <!-- {#

        <div class="px-6 py-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-1.5 bg-yellow-100 rounded-full">
              <svg class="w-6 h-6 text-yellow-500" ...></svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800">Another Setting</h3>
          </div>
          <ul class="ml-10 space-y-1">
            <li>
              <a href="#" class="text-[#800505] hover:underline flex items-center gap-2 font-medium text-sm">
                <svg class="w-4 h-4 text-gray-400" ...></svg>
                Description
              </a>
            </li>
          </ul>
        </div>
      </li>
      #}
    </ul>
  </div>
</div> -->
{% endblock %}
