{% extends 'admin/admin_base.html' %}
{% block content %}
<div class="max-w-lg mx-auto my-10 bg-white rounded-lg shadow-xl border border-[#800505]/10 p-0 overflow-hidden">

  <!-- Header bar -->
  <div class="flex items-center gap-2 px-4 py-3 bg-[#800505] border-b border-[#a80707]">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white opacity-85" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    <h2 class="text-base font-semibold text-white tracking-wide flex-1">
      Pair RFID to Faculty
    </h2>
    <a href="{% url 'adminhub:attendance_logs' %}"
       class="p-1.5 rounded-md hover:bg-white/20 transition" title="Back to Attendance Logs">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
      </svg>
    </a>
  </div>

  <form id="pairRFIDForm"
        class="px-4 py-6 space-y-8"
        method="post"
        action="{% url 'adminhub:pair_rfid' %}"
        autocomplete="off">
    {% csrf_token %}
    {% if message %}
      <div class="rounded-lg px-4 py-3 mb-4 text-sm {{ message_class }}">
        {% autoescape off %}{{ message }}{% endautoescape %}
      </div>
    {% endif %}

    <!-- Faculty Select (Alpine.js) -->
    <div x-data="facultySelect" x-init="init()" class="relative">
      <label class="block text-xs font-semibold text-[#800505] mb-1">Faculty</label>
      <input type="hidden" name="faculty_id" id="faculty_id" x-model="selected">
      <button type="button"
        x-on:click="open = !open"
        class="w-full flex items-center justify-between px-3 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-[#800505] focus:outline-none text-sm transition">
        <span x-text="selectedName() || 'Select Faculty'"></span>
        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 20 20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 8l4 4 4-4" />
        </svg>
      </button>
      <div x-show="open" @click.away="open = false"
           class="absolute z-10 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-64 overflow-y-auto">
        <div class="p-2">
          <input type="text" x-model="search" placeholder="Search faculty..."
                 class="w-full px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-[#800505] focus:outline-none text-sm">
        </div>
        <ul>
          <template x-for="f in options()" :key="f.uuid">
            <li>
              <button type="button"
                class="w-full flex items-center justify-between px-3 py-2 hover:bg-gray-100 text-left text-sm"
                :class="{
                  'font-semibold text-[#800505]': selected === f.uuid,
                  'bg-yellow-50 border-l-4 border-yellow-400': f.is_new,
                  'bg-blue-50': !f.is_new && f.is_unpaired
                }"
                @click="select(f.uuid)">
                <span class="flex items-center gap-2">
                  <span x-text="f.name"></span>
                  <template x-if="f.is_new">
                    <span class="text-xs bg-yellow-400/90 text-white rounded px-1.5 py-0.5 ml-1">NEW</span>
                  </template>
                  <template x-if="!f.is_new && f.is_unpaired">
                    <span class="text-xs bg-blue-300/80 text-white rounded px-1.5 py-0.5 ml-1">Unpaired</span>
                  </template>
                </span>
                <template x-if="rfid_map[f.pk]">
                  <span class="flex items-center gap-1 text-green-700 text-xs font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
                         d="M5 13l4 4L19 7"/></svg> RFID Paired
                  </span>
                </template>
              </button>
            </li>
          </template>
          <template x-if="options().length === 0">
            <li class="px-3 py-2 text-gray-400 text-sm">No faculty found.</li>
          </template>
        </ul>
      </div>
    </div>

    <div>
      <label for="rfid-uid" class="block text-xs font-semibold text-[#800505] mb-1">RFID UID</label>
      <input type="text" id="rfid-uid" name="rfid_uid"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#800505] focus:outline-none text-sm transition" required>
      <div id="rfid-status" class="form-text text-sm"></div>
    </div>
    <div class="flex justify-end pt-3">
      <button type="submit"
              class="px-4 py-2 bg-[#800505] hover:bg-[#a80707] text-white rounded-lg shadow text-sm font-semibold transition">
        Pair
      </button>
    </div>
  </form>
</div>

<!-- Alpine.js for dropdown logic -->
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
{{ faculties|json_script:"faculties-data" }}
{{ rfid_map|json_script:"rfid-map" }}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('facultySelect', () => ({
    search: '',
    selected: '',
    open: false,
    faculties: [],
    rfid_map: {},
    init() {
      this.faculties = JSON.parse(document.getElementById('faculties-data').textContent);
      this.rfid_map = JSON.parse(document.getElementById('rfid-map').textContent);
    },
    options() {
      let q = this.search.toLowerCase();
      return this.faculties.filter(f =>
        f.name.toLowerCase().includes(q)
      );
    },
    select(val) {
      this.selected = val;
      this.open = false;
      document.getElementById('faculty_id').value = val;
    },
    selectedName() {
      let obj = this.faculties.find(f => f.uuid === this.selected);
      return obj ? obj.name : '';
    }
  }))
})
</script>

<!-- RFID UID polling script -->
<script>
let pollingInterval = null;
let lastSeenUid = null;

function startUidPolling() {
    pollingInterval = setInterval(function() {
        fetch("{% url 'adminhub:rfid_pairing_tap_api' %}")
        .then(r => r.json())
        .then(data => {
            if (data.uid && data.uid !== lastSeenUid) {
                lastSeenUid = data.uid;
                document.getElementById("rfid-uid").value = data.uid;
                document.getElementById("rfid-status").innerText = "Auto-filled from RFID tap!";
                document.getElementById("rfid-status").className = "form-text text-success";
            }
        });
    }, 1000);
}
function stopUidPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = null;
}

document.addEventListener('DOMContentLoaded', function() {
    startUidPolling();
});
document.getElementById('pairRFIDForm').addEventListener('submit', function(){
    stopUidPolling();
});
</script>
{% endblock %}
