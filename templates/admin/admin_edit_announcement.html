{% extends "admin/admin_home.html" %}
{% block content %}
<div class="max-w-2xl mx-auto p-4 bg-white rounded-xl shadow">
    <h2 class="text-2xl font-bold mb-4">Edit Announcement</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="mb-4">
                <label class="block font-medium mb-1">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="text-sm text-red-500">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <div class="flex justify-between">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Changes</button>
            <a href="{% url 'announcement_list' %}" class="text-sm text-gray-600 underline self-center">Back to List</a>
        </div>
    </form>
</div>
{% endblock %}
