<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>
    <h2>Forgot Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send OTP</button>
    </form>
    <p style="margin-top: 10px;">
        <a href="{% url 'login' %}">Back to Login</a>
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
</body>
</html>
