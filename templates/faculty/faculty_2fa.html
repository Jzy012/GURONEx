{% extends 'index.html' %}

{% block content %}
<h2>Two-Factor Authentication</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<a href="{% url 'faculty:faculty_settings' %}">Back to Settings</a>

{% for message in messages %}
  <p>{{ message }}</p>
{% endfor %}
{% endblock %}
