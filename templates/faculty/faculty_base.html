<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Faculty{% endblock %}</title>
</head>
<body style="display: flex; min-height: 100vh;">

    <!-- Sidebar -->
    <aside style="width: 200px; background: #f4f4f4; padding: 1em;">
        <h2>Welcome, {{ name }}</h2>
        <nav>
            <ul style="list-style: none; padding: 0;">
                <li><a href="{% url 'faculty:home' %}">🏠 Home</a></li>
                <li><a href="{% url 'faculty:faculty_documents' %}">📄 Documents</a></li>
                <li><a href="{% url 'faculty:faculty_announcements' %}">📢 Announcements</a></li>
                <li><a href="{% url 'faculty:faculty_deliverables' %}">📦 Deliverables</a></li>
                <li><a href="{% url 'faculty:faculty_settings' %}">⚙️ Settings</a></li>
                <li><a href="{% url 'logout' %}">🚪 Logout</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main content -->
    <main style="flex-grow: 1; padding: 2em;">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
