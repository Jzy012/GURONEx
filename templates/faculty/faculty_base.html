{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{% static 'images/pup-favicon.ico' %}" type="image/x-icon">
  <title>{% block title %}Faculty{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <style>
    body { font-family: 'Karla', sans-serif; }
    #sidebar { transition: transform 0.3s ease; }
    #mainContent { transition: margin-left 0.3s ease; }

</head>
<body class="bg-gray-100">

<!-- Navbar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-[#800505] text-white flex items-center px-4 py-3 h-16 shadow-lg border-b border-red-900">

            d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>
  <h1 class="text-lg font-bold">PUP-LINANG</h1>
</header>

<!-- Overlay (mobile) -->
<div id="sidebarOverlay" class="fixed inset-0 z-30 bg-black bg-opacity-40 hidden md:hidden"></div>

        <a href="{% url 'logout' %}" class="flex items-center gap-3 px-3 py-2 text-red-600 hover:text-red-700 hover:bg-[#fdecec] rounded transition-all duration-200">

            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7" />

</aside>


  <!-- Main Content -->
  <main id="mainContent" class="flex-grow p-6">
    {% block content %}{% endblock %}
  </main>
</div>

{% block extra_js %}{% endblock %}

<script>
  const sidebar = document.getElementById("sidebar");
  const toggleBtn = document.getElementById("sidebarToggle");
  const overlay = document.getElementById("sidebarOverlay");
  const mainContent = document.getElementById("mainContent");

  function isDesktop() {
    return window.matchMedia('(min-width: 768px)').matches;
  }

  let sidebarOpen = isDesktop();

  function openSidebar() {
    sidebar.classList.remove('-translate-x-full');
    sidebar.classList.add('translate-x-0');
    if (isDesktop()) {
      mainContent.classList.add('ml-64');
    } else {
      overlay.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }
    sidebarOpen = true;
  }

  function closeSidebar() {
    sidebar.classList.add('-translate-x-full');
    sidebar.classList.remove('translate-x-0');
    if (isDesktop()) {
      mainContent.classList.remove('ml-64');
    } else {
      overlay.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }
    sidebarOpen = false;
  }

  toggleBtn.addEventListener("click", () => {
    sidebarOpen ? closeSidebar() : openSidebar();
  });

  overlay.addEventListener('click', closeSidebar);

  function handleResize() {
    if (isDesktop()) {
      overlay.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      sidebarOpen ? openSidebar() : closeSidebar();
    } else {
      mainContent.classList.remove('ml-64');
      overlay.classList.toggle('hidden', !sidebarOpen);
    }
  }

  window.addEventListener('resize', handleResize);

  isDesktop() ? openSidebar() : closeSidebar();
</script>
</body>
</html>
