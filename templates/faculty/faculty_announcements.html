{% extends "faculty/faculty_base.html" %}
{% block content %}
<h2>Announcements</h2>

{% if announcements %}
    <ul>
        {% for a in announcements %}
            <li style="margin-bottom: 1em;">
                <button onclick="openAnnouncementModal('{{ a.uuid }}')" style="cursor: pointer; font-weight: bold;">
                    {{ a.title }}
                    {% if a.is_important %}<span style="color: red;">(Important)</span>{% endif %}
                    {% if a.uuid not in seen_ids %}<span style="color: green;">[New]</span>{% endif %}
                </button>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No announcements available.</p>
{% endif %}

<!-- Announcement Modal -->
<!-- Modal -->
<div id="announcement-modal"
     style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%);
            width:90%; max-width:600px; background:white; border:1px solid #ccc;
            box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:1000;
            max-height:80vh; overflow-y:auto; padding:1em; box-sizing:border-box;">
    
    <div id="modal-content" style="white-space: pre-wrap; word-wrap: break-word;">
        <!-- Filled dynamically -->
    </div>

    <div style="text-align:right; margin-top: 1em;">
        <button onclick="closeModal()">Close</button>
    </div>
</div>


<!-- Overlay -->
<div id="modal-overlay" onclick="closeModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.4); z-index:999;"></div>

<script>
function openAnnouncementModal(uuid) {
    fetch(`/faculty/announcements/view/${uuid}/`)
        .then(response => response.json())
        .then(data => {
            const modal = document.getElementById("announcement-modal");
            const overlay = document.getElementById("modal-overlay");

            let html = `<h3>${data.title}</h3>`;
            html += `<p>${data.content}</p>`;
            if (data.attachment_link) {
                html += `<p><a href="${data.attachment_link}" target="_blank">View Attachment</a></p>`;
            }

            document.getElementById("modal-content").innerHTML = html;

            modal.style.display = "block";
            overlay.style.display = "block";
        });
}

function closeModal() {
    document.getElementById("announcement-modal").style.display = "none";
    document.getElementById("modal-overlay").style.display = "none";
}
</script>
{% endblock %}
