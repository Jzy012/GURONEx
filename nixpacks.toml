[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "node -v",
  "npm -v",
  "npm ci",
  "npm run build:css",
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "python manage.py collectstatic --noinput; python manage.py migrate --noinput; daphne -b 0.0.0.0 -p $PORT FEMS.asgi:application"
